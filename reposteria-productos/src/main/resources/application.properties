spring.application.name=modulo-productos-reposteria
server.port=8080

# ---------- MySQL ----------
# La base de datos se crea sola si no existe (createDatabaseIfNotExist=true).
# Cambie usuario/contraseña con variables de entorno DB_USER y DB_PASSWORD o editando aquí.
spring.datasource.url=jdbc:mysql://localhost:3306/reposteria_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Bogota

# ---------- JWT ----------
jwt.secret=reposteria-clave-secreta-para-jwt-de-al-menos-32-caracteres-2026
jwt.expiration-ms=3600000

# ---------- Imágenes (patrón Adapter) ----------
# local    -> LocalImageStorage (almacenamiento propio)
# external -> ImageStorageAdapter + ExternalImageService (servicio externo simulado)
imagenes.storage=local
imagenes.directorio=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ---------- Swagger ----------
springdoc.swagger-ui.path=/swagger-ui.html
